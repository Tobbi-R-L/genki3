// Turns a kana character into a quiz item shaped like a grammar/vocab item.
const buildKanaQuizItem = (k, type, pool) => {
  const base = { id: k.id, chapter: k.chapter, point: `${k.script === "hiragana" ? "Hiragana" : "Katakana"}` };
  const sameScript = pool.filter((w) => w.script === k.script && w.id !== k.id);
  if (type === "mc") {
    const dir = Math.random() < 0.5 ? "read" : "recognize";
    if (dir === "read") {
      const distractors = sampleN(sameScript.filter((w) => w.romaji !== k.romaji), 3).map((w) => w.romaji);
      return { ...base, type: "mc", sentence: `What sound does「${k.kana}」make?`, answer: k.romaji, options: shuffle([k.romaji, ...distractors]) };
    }
    const distractors = sampleN(sameScript, 3).map((w) => w.kana);
    return { ...base, type: "mc", sentence: `Which character makes the sound "${k.romaji}"?`, answer: k.kana, options: shuffle([k.kana, ...distractors]) };
  }
  if (type === "fill") {
    return { ...base, type: "fill", sentence: `Write the romaji for: ${k.kana}`, answer: k.romaji };
  }
  return { ...base, type: "translate", dir: "en-jp", sentence: k.romaji, translation: k.kana };
};

const normalizeJP = (s) =>
  (s || "").replace(/[。、！？\s]/g, "")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).trim().toLowerCase();

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const sampleN = (arr, n) => shuffle(arr).slice(0, n);

const weightedTake = (items, weightFn, n) => {
  const keyed = items.map((it) => ({ it, key: Math.pow(Math.random(), 1 / Math.max(weightFn(it), 0.05)) }));
  keyed.sort((a, b) => b.key - a.key);
  return keyed.slice(0, n).map((k) => k.it);
};

const priorityWeight = (id, stats) => {
  const s = stats[id];
  if (!s || s.total === 0) return 6;
  if (s.lastResult === "incorrect") return 5;
  const acc = s.correct / s.total;
  if (acc < 0.5) return 4;
  if (acc < 0.8) return 2;
  return 1;
};

// Turns a vocab word into a quiz item shaped just like a grammar item.
const buildVocabQuizItem = (word, type, pool) => {
  const base = { id: word.id, chapter: word.chapter, point: `Lesson ${word.chapter} vocabulary` };
  if (type === "mc") {
    const dir = Math.random() < 0.5 ? "jp-en" : "en-jp";
    if (dir === "jp-en") {
      const distractors = sampleN(pool.filter((w) => w.id !== word.id && w.en !== word.en), 3).map((w) => w.en);
      return { ...base, type: "mc", sentence: `What does「${word.jp}」mean?`, answer: word.en, options: shuffle([word.en, ...distractors]) };
    }
    const distractors = sampleN(pool.filter((w) => w.id !== word.id && w.jp !== word.jp), 3).map((w) => w.jp);
    return { ...base, type: "mc", sentence: `Which word means "${word.en}"?`, answer: word.jp, options: shuffle([word.jp, ...distractors]) };
  }
  if (type === "fill") {
    return { ...base, type: "fill", sentence: `Write the Japanese word for: "${word.en}"`, answer: word.jp };
  }
  return { ...base, type: "translate", dir: "jp-en", sentence: word.jp, translation: word.en };
};

/* ---------------- conjugation engine ----------------
   Small rule-based conjugator so template questions can swap in a
   different verb/adjective and still compute the right answer.
   Covers regular godan (u-verb) and ichidan (ru-verb) patterns only —
   words with irregular conjugations (する/くる/いい/かっこいい, and いく's
   irregular te/ta-form) are simply never tagged for template pools,
   so this engine never has to handle them.
------------------------------------------------------- */
const GODAN_TE_TA = {
  "う": ["って", "った"], "つ": ["って", "った"], "る": ["って", "った"],
  "む": ["んで", "んだ"], "ぬ": ["んで", "んだ"], "ぶ": ["んで", "んだ"],
  "く": ["いて", "いた"], "ぐ": ["いで", "いだ"], "す": ["して", "した"],
};
const GODAN_I_ROW = { "う": "い", "つ": "ち", "る": "り", "む": "み", "ぬ": "に", "ぶ": "び", "く": "き", "ぐ": "ぎ", "す": "し" };

const teForm = (word) => {
  const last = word.slice(-1);
  const pair = GODAN_TE_TA[last];
  return pair ? word.slice(0, -1) + pair[0] : word.slice(0, -1) + "て"; // ichidan fallback
};
const masuStem = (word) => {
  const last = word.slice(-1);
  const iRow = GODAN_I_ROW[last];
  return iRow ? word.slice(0, -1) + iRow : word.slice(0, -1); // ichidan fallback
};
const isIchidan = (word, tags) => tags.includes("ichidanVerb");
const conjugate = {
  masu: (word, tags) => (isIchidan(word, tags) ? word.slice(0, -1) : masuStem(word)) + "ます",
  masuPast: (word, tags) => (isIchidan(word, tags) ? word.slice(0, -1) : masuStem(word)) + "ました",
  masuNegPast: (word, tags) => (isIchidan(word, tags) ? word.slice(0, -1) : masuStem(word)) + "ませんでした",
  te: (word, tags) => (isIchidan(word, tags) ? word.slice(0, -1) + "て" : teForm(word)),
};
const iAdjPast = (word) => word.slice(0, -1) + "かった";
const iAdjNeg = (word) => word.slice(0, -1) + "くない";

// Picks a random vocab word tagged with `tag` (or any of several
// pipe-separated tags), taught by chapter `maxChapter` or earlier.
const pickVocabWord = (tag, maxChapter) => {
  const wanted = tag.split("|");
  const candidates = VOCAB_ITEMS.filter(
    (w) => w.chapter <= maxChapter && (w.tags || []).some((t) => wanted.includes(t))
  );
  return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
};

// Grammar items store mc options in a fixed order (answer always
// listed first in the data for readability) — shuffle them fresh
// every time a queue is built so the position is never a giveaway.
// Template items (item.template === true) get a fresh word substituted
// in from the tagged vocab pool and their answer recomputed each time.
const prepGrammarItem = (item) => {
  let out = item;
  if (item.template) {
    const word = pickVocabWord(item.slot, item.chapter);
    const built = word ? item.build(word) : item.fallback();
    out = { id: item.id, chapter: item.chapter, point: item.point, type: item.type, dir: item.dir, ...built };
  }
  return out.type === "mc" ? { ...out, options: shuffle(out.options) } : out;
};

const GRAMMAR_STATS_KEY = "genki-dojo-item-stats-v3";
const VOCAB_STATS_KEY = "genki-dojo-vocab-stats-v1";
const KANA_STATS_KEY = "genki-dojo-kana-stats-v1";
const loadStats = (key) => {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
};
const saveStats = (key, stats) => {
  try { window.localStorage.setItem(key, JSON.stringify(stats)); } catch (e) { /* best effort */ }
};

function App() {
  const [mode, setMode] = useState("grammar");
  const [screen, setScreen] = useState("setup");
  const [selectedChapters, setSelectedChapters] = useState(new Set([1, 2, 3]));
  const [selectedTypes, setSelectedTypes] = useState(new Set(["mc", "fill", "translate"]));
  const [sessionSize, setSessionSize] = useState(20);
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState({ correct: 0, total: 0 });
  const [allStats, setAllStats] = useState(() => ({
    grammar: loadStats(GRAMMAR_STATS_KEY), vocab: loadStats(VOCAB_STATS_KEY), kana: loadStats(KANA_STATS_KEY),
  }));

  const [selectedOpt, setSelectedOpt] = useState(null);
  const [textInput, setTextInput] = useState("");
  const [revealed, setRevealed] = useState(false);
  const [verdict, setVerdict] = useState(null);

  const isGrammar = mode === "grammar";
  const isKana = mode === "kana";
  const chapterTitles = isGrammar ? CHAPTER_TITLES : isKana ? KANA_CHAPTER_TITLES : VOCAB_CHAPTER_TITLES;
  const itemsSource = isGrammar ? GRAMMAR_ITEMS : isKana ? KANA_ITEMS : VOCAB_ITEMS;
  const statsKey = isGrammar ? GRAMMAR_STATS_KEY : isKana ? KANA_STATS_KEY : VOCAB_STATS_KEY;
  const stats = allStats[mode];

  const rawPool = useMemo(
    () => itemsSource.filter((it) => selectedChapters.has(it.chapter)),
    [itemsSource, selectedChapters]
  );
  const pool = isGrammar ? rawPool.filter((it) => selectedTypes.has(it.type)) : rawPool;

  const chapterAccuracy = useMemo(() => {
    const acc = {};
    for (const n of Object.keys(chapterTitles).map(Number)) {
      const items = itemsSource.filter((it) => it.chapter === n);
      let correct = 0, total = 0;
      for (const it of items) {
        const s = stats[it.id];
        if (s) { correct += s.correct; total += s.total; }
      }
      acc[n] = total ? Math.round((correct / total) * 100) : null;
    }
    return acc;
  }, [itemsSource, stats, chapterTitles]);

  const switchMode = (m) => { setMode(m); setScreen("setup"); };

  const startQuiz = () => {
    const n = sessionSize === "all" ? pool.length : Math.min(sessionSize, pool.length);
    if (isGrammar) {
      const picked = weightedTake(pool, (it) => priorityWeight(it.id, stats), n).map(prepGrammarItem);
      setQueue(picked);
    } else {
      const items = weightedTake(rawPool, (w) => priorityWeight(w.id, stats), n);
      const typesArr = Array.from(selectedTypes);
      const builder = isKana ? buildKanaQuizItem : buildVocabQuizItem;
      const picked = items.map((it) => builder(it, typesArr[Math.floor(Math.random() * typesArr.length)], rawPool));
      setQueue(picked);
    }
    setIdx(0);
    setScore({ correct: 0, total: 0 });
    resetQuestionState();
    setScreen("quiz");
  };

  const resetQuestionState = () => { setSelectedOpt(null); setTextInput(""); setRevealed(false); setVerdict(null); };

  const current = queue[idx];

  const recordResult = (itemId, correct) => {
    const base = allStats[mode];
    const next = { ...base };
    const s = next[itemId] || { correct: 0, total: 0 };
    next[itemId] = { correct: s.correct + (correct ? 1 : 0), total: s.total + 1, lastResult: correct ? "correct" : "incorrect" };
    setAllStats((prev) => ({ ...prev, [mode]: next }));
    saveStats(statsKey, next);
    setScore((sc) => ({ correct: sc.correct + (correct ? 1 : 0), total: sc.total + 1 }));
  };

  const submitMC = (opt) => {
    if (verdict) return;
    setSelectedOpt(opt);
    const correct = opt === current.answer;
    setVerdict(correct ? "correct" : "incorrect");
    recordResult(current.id, correct);
  };
  const submitFill = () => {
    if (verdict) return;
    const candidates = [current.answer, ...(current.altAnswers || [])].map(normalizeJP);
    const correct = candidates.includes(normalizeJP(textInput));
    setVerdict(correct ? "correct" : "incorrect");
    recordResult(current.id, correct);
  };
  const revealTranslation = () => { if (!revealed) setRevealed(true); };
  const selfGrade = (correct) => {
    if (verdict) return;
    setVerdict(correct ? "correct" : "incorrect");
    recordResult(current.id, correct);
  };
  const goNext = () => {
    resetQuestionState();
    if (idx + 1 >= queue.length) setScreen("summary");
    else setIdx(idx + 1);
  };

  const toggleChapter = (n) => {
    const next = new Set(selectedChapters);
    next.has(n) ? next.delete(n) : next.add(n);
    setSelectedChapters(next);
  };
  const toggleType = (t) => {
    const next = new Set(selectedTypes);
    if (next.has(t) && next.size === 1) return;
    next.has(t) ? next.delete(t) : next.add(t);
    setSelectedTypes(next);
  };

  return (
    <div style={S.appRoot}>
      <div style={S.grid} />
      <header style={S.header}>
        <div style={S.headerInner}>
          <div style={S.brandRow}>
            <div style={S.hankoMark}>正</div>
            <div>
              <div style={S.brandTitle}>文法道場</div>
              <div style={S.brandSub}>GRAMMAR &amp; VOCAB DOJO — Genki I, Ch. 1–7</div>
            </div>
          </div>
          {screen === "quiz" && <button style={S.quitBtn} onClick={() => setScreen("setup")}>End session</button>}
        </div>
        {screen === "setup" && (
          <div style={S.modeRow}>
            <button style={{ ...S.modeBtn, ...(mode === "grammar" ? S.modeBtnActive : {}) }} onClick={() => switchMode("grammar")}>文法 Grammar</button>
            <button style={{ ...S.modeBtn, ...(mode === "vocab" ? S.modeBtnActive : {}) }} onClick={() => switchMode("vocab")}>単語 Vocabulary</button>
            <button style={{ ...S.modeBtn, ...(mode === "kana" ? S.modeBtnActive : {}) }} onClick={() => switchMode("kana")}>かな Kana</button>
          </div>
        )}
      </header>

      <main style={S.main}>
        {screen === "setup" && (
          <SetupScreen
            chapterTitles={chapterTitles} selectedChapters={selectedChapters} toggleChapter={toggleChapter}
            selectedTypes={selectedTypes} toggleType={toggleType}
            sessionSize={sessionSize} setSessionSize={setSessionSize}
            pool={pool} startQuiz={startQuiz} chapterAccuracy={chapterAccuracy}
            poolLabel={isGrammar ? "question" : isKana ? "character" : "word"}
            upcoming={isKana ? [] : UPCOMING_CHAPTERS}
          />
        )}
        {screen === "quiz" && current && (
          <QuizScreen
            item={current} idx={idx} total={queue.length} score={score}
            selectedOpt={selectedOpt} submitMC={submitMC}
            textInput={textInput} setTextInput={setTextInput} submitFill={submitFill}
            revealed={revealed} revealTranslation={revealTranslation}
            selfGrade={selfGrade} verdict={verdict} onNext={goNext}
          />
        )}
        {screen === "summary" && <SummaryScreen score={score} onRestart={() => setScreen("setup")} onRedo={startQuiz} />}
      </main>
    </div>
  );
}

function SetupScreen({ chapterTitles, selectedChapters, toggleChapter, selectedTypes, toggleType, sessionSize, setSessionSize, pool, startQuiz, chapterAccuracy, poolLabel, upcoming }) {
  const chapters = Object.keys(chapterTitles).map(Number);
  return (
    <div style={S.setupWrap}>
      <section style={S.card}>
        <div style={S.cardLabel}>教材　CHAPTERS</div>
        <div style={S.chapterGrid}>
          {chapters.map((n) => {
            const active = selectedChapters.has(n);
            const acc = chapterAccuracy[n];
            return (
              <button key={n} onClick={() => toggleChapter(n)} style={{ ...S.chapterTile, ...(active ? S.chapterTileActive : {}) }}>
                <div style={S.chapterNum}>{String(n).padStart(2, "0")}</div>
                <div style={S.chapterName}>{chapterTitles[n]}</div>
                {acc !== null && <div style={S.chapterAcc}>{acc}% mastered</div>}
              </button>
            );
          })}
          {upcoming.map((n) => (
            <div key={n} style={S.chapterTileDisabled}>
              <div style={S.chapterNum}>{String(n).padStart(2, "0")}</div>
              <div style={S.chapterName}>coming soon</div>
            </div>
          ))}
        </div>
      </section>

      <section style={S.card}>
        <div style={S.cardLabel}>けいしき　DRILL TYPES</div>
        <div style={S.typeRow}>
          <TypeChip label="Multiple choice" desc="click the correct answer" active={selectedTypes.has("mc")} onClick={() => toggleType("mc")} />
          <TypeChip label="Write the word" desc="type the correct form" active={selectedTypes.has("fill")} onClick={() => toggleType("fill")} />
          <TypeChip label="Write the translation" desc="self-graded" active={selectedTypes.has("translate")} onClick={() => toggleType("translate")} />
        </div>
      </section>

      <section style={S.card}>
        <div style={S.cardLabel}>ながさ　SESSION LENGTH</div>
        <div style={S.sizeRow}>
          {SESSION_SIZE_OPTIONS.map((opt) => (
            <button key={opt} onClick={() => setSessionSize(opt)} style={{ ...S.sizeChip, ...(sessionSize === opt ? S.sizeChipActive : {}) }}>
              {opt === "all" ? "All" : opt}
            </button>
          ))}
        </div>
        <div style={S.sizeNote}>New and previously-missed items are prioritized automatically.</div>
      </section>

      <div style={S.startRow}>
        <div style={S.poolCount}>{pool.length} {poolLabel}{pool.length === 1 ? "" : "s"} in this filter</div>
        <button style={{ ...S.startBtn, opacity: pool.length ? 1 : 0.4 }} disabled={!pool.length} onClick={startQuiz}>✨ Begin practice</button>
      </div>
    </div>
  );
}

function TypeChip({ label, desc, active, onClick }) {
  return (
    <button onClick={onClick} style={{ ...S.typeChip, ...(active ? S.typeChipActive : {}) }}>
      <div style={S.typeChipLabel}>{label}</div>
      <div style={S.typeChipDesc}>{desc}</div>
    </button>
  );
}

function QuizScreen({ item, idx, total, score, selectedOpt, submitMC, textInput, setTextInput, submitFill, revealed, revealTranslation, selfGrade, verdict, onNext }) {
  return (
    <div style={S.quizWrap}>
      <div style={S.progressRow}>
        {Array.from({ length: total }).map((_, i) => (
          <div key={i} style={{ ...S.progressCell, ...(i < idx ? S.progressCellDone : {}), ...(i === idx ? S.progressCellCurrent : {}) }} />
        ))}
      </div>
      <div style={S.metaRow}>
        <span style={S.chapterBadge}>Ch.{item.chapter} — {item.point}</span>
        <span style={S.scoreText}>{score.correct} / {score.total}</span>
      </div>

      <div style={S.qCard}>
        {verdict && <StampOverlay verdict={verdict} />}
        <div style={S.qSentence}>{item.sentence}</div>

        {item.type === "mc" && (
          <div style={S.optionsGrid}>
            {item.options.map((opt) => {
              const isChosen = selectedOpt === opt;
              const isAnswer = opt === item.answer;
              let style = S.optionBtn;
              if (verdict && isAnswer) style = { ...style, ...S.optionCorrect };
              else if (verdict && isChosen && !isAnswer) style = { ...style, ...S.optionWrong };
              else if (isChosen) style = { ...style, ...S.optionChosen };
              return <button key={opt} style={style} onClick={() => submitMC(opt)} disabled={!!verdict}>{opt}</button>;
            })}
          </div>
        )}

        {item.type === "fill" && (
          <div>
            <input style={S.fillInput} value={textInput} disabled={!!verdict}
              onChange={(e) => setTextInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitFill()}
              placeholder="こたえを　かいて　ください" />
            {!verdict ? (
              <button style={S.checkBtn} onClick={submitFill} disabled={!textInput.trim()}>Check</button>
            ) : (
              verdict === "incorrect" && <div style={S.correctAnswerBox}>Correct answer: <strong>{item.answer}</strong></div>
            )}
          </div>
        )}

        {item.type === "translate" && (
          <div>
            <div style={S.translateDirLabel}>{item.dir === "jp-en" ? "Write the English translation" : "Write the Japanese translation"}</div>
            <textarea style={S.translateInput} value={textInput} disabled={revealed}
              onChange={(e) => setTextInput(e.target.value)}
              placeholder={item.dir === "jp-en" ? "type the English meaning..." : "こたえを かいて ください"} />
            {!revealed ? (
              <button style={S.checkBtn} onClick={revealTranslation} disabled={!textInput.trim()}>Reveal answer</button>
            ) : (
              <>
                <div style={S.correctAnswerBox}>Model answer: <strong>{item.translation}</strong></div>
                {!verdict && (
                  <div style={S.selfGradeRow}>
                    <span style={S.selfGradeLabel}>Did you get it right?</span>
                    <button style={S.selfGradeYes} onClick={() => selfGrade(true)}>✓ Yes</button>
                    <button style={S.selfGradeNo} onClick={() => selfGrade(false)}>✕ No</button>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {verdict && item.note && <div style={S.noteBox}>{item.note}</div>}
        {verdict && item.type !== "translate" && item.translation && <div style={S.translationLine}>{item.translation}</div>}
      </div>

      {verdict && <button style={S.nextBtn} onClick={onNext}>{idx + 1 >= total ? "Finish session" : "Next question"} →</button>}
    </div>
  );
}

function StampOverlay({ verdict }) {
  if (verdict === "correct") {
    return <div style={{ ...S.hankoStamp, animation: "stampDown 0.35s cubic-bezier(.2,1.4,.4,1)" }}><div style={S.hankoStampInner}>正</div></div>;
  }
  return <div style={{ ...S.inkX, animation: "inkIn 0.3s ease-out" }}>✕</div>;
}

function SummaryScreen({ score, onRestart, onRedo }) {
  const pct = score.total ? Math.round((score.correct / score.total) * 100) : 0;
  return (
    <div style={S.summaryWrap}>
      <div style={S.hankoMarkBig}>{pct >= 80 ? "合格" : "もう一度"}</div>
      <div style={S.summaryScore}>{score.correct} / {score.total}</div>
      <div style={S.summarySub}>{pct}% correct this session</div>
      <div style={S.summaryBtnRow}>
        <button style={S.startBtn} onClick={onRedo}>↻ New set (same filters)</button>
        <button style={S.quitBtnLarge} onClick={onRestart}>📖 Choose new chapters</button>
      </div>
    </div>
  );
}
